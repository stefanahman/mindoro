name: ci
on:
  push:
    branches: [main]
  pull_request:
# A newer push to a pull request makes the older run pointless. Other runs
# get a group of their own: a shared one would make them wait in turn, and
# a newer waiting run would cancel an older one, leaving a push without a
# result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# Read-only token: the checks only read the code.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # No step needs git credentials; don't leave the token on disk.
          persist-credentials: false
      - name: install bats, shellcheck and tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck tmux
      - run: make lint
      - run: make test
