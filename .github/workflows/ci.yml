name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats, shellcheck and tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck tmux
      - run: make lint
      - run: make test
